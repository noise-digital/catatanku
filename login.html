<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Masuk · Catatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loadbar" class="loadbar" hidden></div>
<main class="login">
  <h1>Masuk ke dashboard</h1>
  <ol class="steps">
    <li>Buka bot Telegram Anda, lalu kirim <strong>LOGIN</strong>.</li>
    <li>Ketuk tautan di balasan bot. Anda langsung masuk. (Cara manual: isi ID Telegram dan kode 6 digit di bawah. Kode berlaku 5 menit.)</li>
  </ol>
  <form id="loginForm" class="panel formgrid" novalidate>
    <div>
      <label for="tgid">ID Telegram</label>
      <input id="tgid" name="tgid" type="text" inputmode="numeric" autocomplete="off" placeholder="123456789" required>
    </div>
    <div>
      <label for="kode">Kode login</label>
      <input id="kode" name="kode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digit" required>
    </div>
    <p id="loginMsg" class="formerror" role="alert"></p>
    <button id="btnLogin" class="btn" type="submit">Masuk</button>
  </form>
</main>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
